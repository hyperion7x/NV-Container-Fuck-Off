name: Build Native NV Container Fuck Off for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Compile native Win32 EXE (MSVC, x64)
        shell: cmd
        run: call build.cmd
      - name: Verify EXE and generate SHA-256
        shell: pwsh
        run: |
          $exe = 'dist/NVContainerFuckOff.exe'
          if (-not (Test-Path $exe)) { throw 'Missing native executable' }
          $bytes = (Get-Item $exe).Length
          if ($bytes -gt 1048576) { throw "Unexpectedly large native EXE: $bytes bytes" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NVContainerFuckOff.exe" | Set-Content 'dist/NVContainerFuckOff.exe.sha256' -Encoding ascii
          "EXE size: $bytes bytes" | Write-Output
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: NVContainerFuckOff-Native-Windows-x64
          path: |
            dist/NVContainerFuckOff.exe
            dist/NVContainerFuckOff.exe.sha256
          if-no-files-found: error
